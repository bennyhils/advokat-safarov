services:
  app:
    image: advokat-nsk-app:latest
    build: .
    platform: linux/amd64
    container_name: advokat-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SERVER_URL: https://advokat-safarov.online
      DATABASE_URL: file:///data/advokat-nsk.db
    volumes:
      - sqlite-data:/data
      - media-data:/app/media
    expose:
      - "3000"
    networks:
      - web

  nginx:
    image: nginx:1.27-alpine
    container_name: advokat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - app
    command: ["/bin/sh", "-c", "while true; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    networks:
      - web

  certbot:
    image: certbot/certbot
    container_name: advokat-certbot
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c
    command: "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;"
    networks:
      - web

volumes:
  sqlite-data:
  media-data:

networks:
  web:
    driver: bridge
